# ISW2 2026/27: build and tests of the modules of the two exam classes (UIHelpers in storm-webapp,
# BaseProcessor in storm-client), same steps as the local build described in ISW2.md
name: ISW2 build

on:
  push:
    branches: [ "isw2-2026" ]
  pull_request:
    branches: [ "isw2-2026" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install the shaded dependencies
        run: mvn clean install --batch-mode -pl storm-shaded-deps -am
      - name: Build storm-client and storm-webapp
        run: mvn install --batch-mode -DskipTests -pl storm-client,storm-webapp -am
      - name: Run the tests
        run: >-
          mvn verify --batch-mode -pl storm-client,storm-webapp
          -Dtest='UIHelpersTest,JoinProcessorTest,CoGroupByKeyProcessorTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
